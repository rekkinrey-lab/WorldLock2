# WorldLock configuration

# The ONLY world this plugin affects (block rules + join teleport).
# All other worlds are left completely untouched.
world: world

# Block breaking is cancelled for everyone in the world above.
block-break-disabled: true

# Block placing is cancelled for everyone in the world above.
block-place-disabled: true

# Every join (first join and rejoin) teleports the player here.
teleport-on-join: true
spawn:
  x: 2.5
  y: 0.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
